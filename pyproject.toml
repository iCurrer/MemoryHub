[project]
name = "memoryhub"
version = "0.0.1"
description = "Cross-AI personal memory governance layer: local-first, auditable, portable."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
dependencies = []

[project.scripts]
memoryhub = "memoryhub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memoryhub"]

[tool.pytest.ini_options]
pythonpath = ["src"]
