[project]
name = "memoryhub"
version = "0.0.1"
description = "Cross-AI personal memory governance layer: local-first, auditable, portable."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
# First runtime dependency. ADR-005 kept phase 1 stdlib-only to prove the data
# model; the migration to PyYAML is recorded there as a partial supersession.
# `mcp` is the largest one: it drags in pydantic/starlette/uvicorn, of which the
# HTTP servers are unused (stdio only). See ADR-012 for the review point.
dependencies = [
    "pyyaml>=6.0",
    "mcp>=2.0,<3",
]

[project.scripts]
memoryhub = "memoryhub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memoryhub"]

[tool.pytest.ini_options]
pythonpath = ["src"]
