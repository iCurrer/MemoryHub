<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mh-token" content="__MEMORYHUB_TOKEN__">
<title>MemoryHub</title>
<style>
  :root {
    --bg: #0d1013;
    --card: #171b20;
    --card-2: #1d2228;
    --line: #262d35;
    --fg: #e6ebf1;
    --dim: #8b949e;
    --faint: #565f6a;
    --ok: #3fb950;
    --no: #f85149;
    --warn: #d29922;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* One column, phone-width on purpose: a memory card is a thing you read one
     at a time, not a dashboard you scan in a grid. */
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 16px 80px; }

  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px 10px; background: linear-gradient(var(--bg) 70%, rgba(13,16,19,0));
  }
  header .title { font-size: 15px; font-weight: 600; letter-spacing: .04em; }
  header .spacer { flex: 1; }
  header button {
    background: transparent; border: 1px solid var(--line); color: var(--dim);
    padding: 5px 11px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 12px;
  }
  header button:hover { color: var(--fg); border-color: var(--faint); }

  .facts { color: var(--faint); font-size: 12px; padding: 0 16px 10px; line-height: 1.7; }
  .facts b { color: var(--dim); font-weight: 600; }
  .facts .path { overflow-wrap: anywhere; }

  .pills { display: flex; gap: 8px; padding: 4px 16px 14px; flex-wrap: wrap; }
  .pill {
    background: var(--card-2); border: 1px solid var(--line); color: var(--dim);
    padding: 6px 14px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 13px;
  }
  .pill[aria-selected="true"] { color: #08131f; background: #a8c7e8; border-color: #a8c7e8; font-weight: 600; }
  .pill .n { opacity: .7; margin-left: 5px; font-variant-numeric: tabular-nums; }
  .pill.sub { font-size: 12px; padding: 4px 11px; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 16px 12px; margin-bottom: 12px;
  }
  .card.todo { border-color: #2f3946; }
  .card.blocked { border-color: #4a3417; }

  .meta { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; color: var(--faint); font-size: 11.5px; margin-bottom: 9px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: #232a33; border-radius: 6px; padding: 2px 7px; color: #b9c4d0;
  }
  .chip.cat { background: #24313d; color: #a9c8e4; }
  .chip.warn { background: #3a2c10; color: #e3b341; }
  .chip.bad { background: #3a1a18; color: #ff948b; }
  .chip.ok { background: #17301c; color: #6fd07d; }

  .line { font-size: 15.5px; line-height: 1.55; color: #f0f4f8; margin: 0; overflow-wrap: anywhere; }
  .line .mark { color: var(--faint); font-size: 11px; margin-left: 6px; }
  .body { margin-top: 10px; }
  .body[hidden] { display: none; }
  .body .l-h { color: #cfd8e3; font-weight: 600; margin: 10px 0 4px; font-size: 13.5px; }
  .body .l-li { padding-left: 14px; position: relative; color: #c3ccd6; font-size: 13px; }
  .body .l-li::before { content: "·"; position: absolute; left: 3px; color: var(--faint); }
  .body .l-p { color: #c3ccd6; font-size: 13px; }
  .body .l-gap { height: 6px; }
  details.raw { margin-top: 10px; }
  details.raw > summary {
    display: flex; align-items: center; gap: 6px; list-style: none; cursor: pointer;
    color: var(--faint); font-size: 12px;
  }
  details.raw > summary::-webkit-details-marker { display: none; }
  details.raw > summary::before { content: "▸"; font-size: 10px; }
  details.raw[open] > summary::before { content: "▾"; }
  details.raw > summary:hover { color: var(--dim); }

  .acts { display: flex; gap: 8px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
  .acts .gap { flex: 1; }
  .acts .id { color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
  button.act {
    font: inherit; font-size: 13px; padding: 8px 18px; border-radius: 10px; cursor: pointer;
    background: var(--card-2); color: var(--fg); border: 1px solid var(--line);
  }
  button.act:hover:not(:disabled) { border-color: var(--faint); }
  button.act:disabled { opacity: .38; cursor: not-allowed; }
  button.act.yes { color: #c8f0cf; border-color: #2b4a31; }
  button.act.yes:hover:not(:disabled) { background: #1b2b1e; border-color: var(--ok); }
  button.act.no { color: #ffb0a9; border-color: #4a2622; }
  button.act.no:hover:not(:disabled) { background: #2b1a18; border-color: var(--no); }
  /* The armed state *is* the confirmation. A native dialog would be simpler to
     write and has already failed once: inside a sandboxed preview frame it
     returns false without showing anything, so the button looked dead. */
  button.act.armed { background: #2b1a18; border-color: var(--no); color: #ffd7d2; }

  .note { color: var(--dim); font-size: 12.5px; border-left: 2px solid var(--line); padding: 2px 0 2px 10px; margin: 10px 0 0; }
  .quotes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 2px 0 4px; }
  @media (max-width: 620px) { .quotes { grid-template-columns: 1fr; } }
  .q { background: #12161a; border: 1px solid #202832; border-left: 2px solid var(--accent); border-radius: 8px; padding: 8px 10px; font-size: 13px; color: #dde5ee; overflow-wrap: anywhere; }
  .q .who { display: block; color: var(--faint); font-size: 10.5px; margin-bottom: 3px; }
  .warn { color: #cf9d2f; font-size: 12px; margin-top: 8px; line-height: 1.6; }
  .warn::before { content: "⚠ "; }

  .empty { color: var(--faint); text-align: center; padding: 44px 10px; font-size: 13px; line-height: 1.9; }
  .empty code { background: var(--card-2); padding: 1px 6px; border-radius: 5px; color: var(--dim); }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(16px);
    background: #232a33; border: 1px solid var(--line); color: var(--fg); font-size: 13px;
    padding: 9px 16px; border-radius: 10px; opacity: 0; pointer-events: none;
    transition: opacity .18s, transform .18s; max-width: 76vw;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.bad { border-color: #5c1e1c; color: #ffb4ab; }
</style>
</head>
<body>
<header>
  <span class="title">记忆</span>
  <span class="spacer"></span>
  <button id="refresh" title="重新读一遍库">刷新</button>
</header>

<div class="facts" id="facts"></div>

<nav class="pills" id="pills">
  <button class="pill" data-view="todo" aria-selected="true">待办<span class="n" id="n-todo"></span></button>
  <button class="pill" data-view="all" aria-selected="false">已记<span class="n" id="n-all"></span></button>
</nav>

<div class="pills" id="cats" hidden></div>

<div class="wrap" id="feed"></div>
<div id="toast"></div>

<script>
// The token comes from the meta tag the server fills in; the URL parameter is a
// fallback for a page opened from a printed address. Never localStorage -- a
// token that survives the tab outlives the process it belongs to.
const metaEl = document.querySelector('meta[name="mh-token"]');
const rendered = metaEl ? metaEl.content : "";
let TOKEN = rendered && !rendered.startsWith("__") ? rendered : "";
if (!TOKEN) TOKEN = new URLSearchParams(location.search).get("t") || sessionStorage.getItem("mh-token") || "";
if (TOKEN) sessionStorage.setItem("mh-token", TOKEN);
// ?t= stays in the address bar: stripping it looked tidy and turned every
// reload into a 401, because that URL was the only copy the server could check.

const CAT = { profile: "身份", decision: "决定", preference: "偏好", project: "项目", knowledge: "知识" };
let state = { overview: null, pending: [], proposals: [], entries: [], view: "todo", cat: "", cursor: 0 };

function el(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return node;
}

async function api(path, body) {
  const opt = { headers: { "X-MemoryHub-Token": TOKEN } };
  if (body) {
    opt.method = "POST";
    opt.headers["Content-Type"] = "application/json";
    opt.body = JSON.stringify(body);
  }
  const res = await fetch(path, opt);
  const data = await res.json().catch(() => ({ ok: false, error: "响应不是 JSON" }));
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

let toastTimer = null;
function toast(msg, bad) {
  const box = document.getElementById("toast");
  box.textContent = msg;
  box.className = "show" + (bad ? " bad" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { box.className = ""; }, bad ? 6500 : 2400);
}

function chip(text, cls) { return el("span", { class: "chip" + (cls ? " " + cls : "") }, text); }

// ------------------------------------------------------------- two-step action

//: A destructive click needs one confirming click, not a dialog. Native dialogs
//: are a dead end in this page's preview frame -- they return false silently,
//: which reads to the user as "the button does nothing".
const ARMED_MS = 5000;

function twoStep(button, label, armedLabel, run) {
  button.textContent = label;
  button.addEventListener("click", () => {
    if (button.dataset.armed !== "1") {
      button.dataset.armed = "1";
      button.classList.add("armed");
      button.textContent = armedLabel;
      button._timer = setTimeout(() => disarm(button, label), ARMED_MS);
      return;
    }
    disarm(button, label);
    run();
  });
}

function disarm(button, label) {
  clearTimeout(button._timer);
  button.dataset.armed = "0";
  button.classList.remove("armed");
  button.textContent = label;
}

// ------------------------------------------------------------------ rendering

function lineNode(line) {
  const heading = line.match(/^\s*#{1,6}\s+(.*)$/);
  if (heading) return el("div", { class: "l-h" }, heading[1].replace(/\*\*/g, ""));
  const bullet = line.match(/^\s*(?:[-*+]|\d+[.)])\s+(.*)$/);
  if (bullet) return el("div", { class: "l-li" }, bullet[1].replace(/\*\*/g, ""));
  if (!line.trim()) return el("div", { class: "l-gap" });
  return el("div", { class: "l-p" }, line.replace(/\*\*/g, ""));
}

function rawBody(entry) {
  const skip = (entry.headline && entry.headline.skip) || 0;
  const wrap = el("div", { class: "body" });
  for (const line of entry.body.split("\n").slice(skip)) wrap.append(lineNode(line));
  return wrap;
}

/** The sentence at the top of a card.
 *
 * Prefers the model's one-liner (``summary``) when the user has run
 * ``memoryhub summarize``; otherwise the entry's own most factual first line.
 * Both are labelled differently on screen, because one of them is a paraphrase
 * and the other is a quote -- the page must not let them look the same.
 */
function titleNode(entry) {
  const derived = entry.summary;
  const text = derived || (entry.headline && entry.headline.text) || entry.body.slice(0, 44);
  return el("p", { class: "line" }, text,
    derived ? el("span", { class: "mark", title: "模型按原文概括的一句话，原文见下" }, "概括") : null);
}

function entryCard(entry, opts) {
  const o = opts || {};
  const blocked = entry.trust === "blocked";
  const meta = el("div", { class: "meta" },
    chip(CAT[entry.category] || entry.category, "cat"),
    entry.headline && entry.headline.section ? chip(entry.headline.section) : null,
    entry.source_adapter ? chip(entry.source_adapter) : null,
    entry.sensitivity !== "normal" ? chip("敏感：" + entry.sensitivity, "bad") : null,
    blocked ? chip("blocked", "warn") : null,
    el("span", {}, (entry.created_at || "").slice(0, 10)));

  const card = el("article", { class: "card" + (o.todo ? " todo" : "") + (blocked ? " blocked" : "") }, meta, titleNode(entry));

  // The original text is one tap away and always available: the summary is a
  // convenience, the body is the evidence.
  if (entry.chars > 30 || entry.summary) {
    card.append(el("details", { class: "raw" },
      el("summary", {}, "原文 · " + entry.chars + " 字"),
      rawBody(entry)));
  }

  if (o.todo) {
    const yes = el("button", { class: "act yes", disabled: blocked,
      title: blocked ? "blocked 不能直接批：先降 sensitivity" : "进入检索与回写" });
    twoStep(yes, "留着", "确定留着？", () => decide(entry, "approve"));
    const no = el("button", { class: "act no" });
    twoStep(no, "不要", "确定不要？", () => decide(entry, "reject"));
    card.append(el("div", { class: "acts" }, yes, no, el("span", { class: "gap" }),
      el("select", { class: "act", onchange: (ev) => decide(entry, "category", ev.target.value) },
        el("option", { value: "" }, "改分类"),
        ...Object.entries(CAT).filter(([k]) => k !== entry.category).map(([k, v]) => el("option", { value: k }, v)))));
  }
  return card;
}

function proposalCard(p) {
  const contested = p.relation === "contradicts";
  //: `partial` means only some sentences of an entry are involved. The card must
  //: say so, because the two buttons below act on the *whole* entry.
  const partial = p.scope === "partial";
  const claims = (p.claims || []).filter(c => c.quote_left || c.quote_right);
  const card = el("article", { class: "card todo" },
    el("div", { class: "meta" },
      chip(contested ? "两条说法冲突" : "两条有重叠", contested ? "warn" : "ok"),
      partial ? chip("只有一句重叠", "warn") : null,
      el("span", {}, (p.detected_at || "").slice(0, 10))));

  // The evidence, not the entries: 44 characters against 382 characters is
  // unreadable as a pair of documents and obvious as a pair of quoted spans.
  if (claims.length) {
    for (const c of claims.slice(0, 2)) {
      card.append(el("div", { class: "quotes" },
        el("div", { class: "q" }, el("span", { class: "who" }, "A"), c.quote_left || "—"),
        el("div", { class: "q" }, el("span", { class: "who" }, "B"), c.quote_right || "—")));
    }
  } else {
    card.append(el("div", { class: "warn" }, "这条提案没有引文证据，只剩模型的结论。展开原文再看。"));
  }
  if (p.reason) card.append(el("div", { class: "note" }, p.reason));
  if (partial) {
    card.append(el("div", { class: "note" },
      "只有一句重叠，两条其余内容各说各的。下面两个按钮归档的是整条记忆，"
      + "会把不重叠的部分一起藏起来。"));
  }

  const keep = (entry, label) => {
    if (!entry) return null;
    const b = el("button", { class: "act yes" });
    twoStep(b, "留 " + label, "确定留 " + label + "？", () => supersede(entry, other(p, entry.id), p));
    return b;
  };
  const unclear = el("button", { class: "act no", title: "两条记忆都不动，只是不再问这一对" });
  //: One click, deliberately. Every other action here changes the vault and
  //: therefore arms first; this one changes nothing in the vault. Putting a
  //: confirmation in front of the *exit* is how the trap got built.
  unclear.textContent = "无关，别再问";
  unclear.addEventListener("click", () => dismissProposal(p));
  const crowded = [p.left, p.right].filter(e => e && e.crowded);
  card.append(el("div", { class: "acts" }, keep(p.left, "A"), keep(p.right, "B"),
    el("span", { class: "gap" }), unclear,
    el("span", { class: "gap" }),
    el("span", { class: "id" }, (p.left ? p.left.chars : "?") + " 字 / " + (p.right ? p.right.chars : "?") + " 字")));
  if (crowded.length) {
    card.append(el("div", { class: "warn" },
      "其中 " + crowded.map(e => e.chars + " 字").join(" / ") + " 那条装了好几件事——"
      + "取代它会连带藏掉里面的其它内容，留着它没有损失。"));
  }
  card.append(el("details", { class: "raw" },
    el("summary", {}, "展开两条完整记忆"),
    el("div", { class: "body" },
      el("div", { class: "l-h" }, "A"), p.left ? rawBody(p.left) : el("div", { class: "l-p" }, "这一侧在库里找不到了"),
      el("div", { class: "l-h" }, "B"), p.right ? rawBody(p.right) : el("div", { class: "l-p" }, "这一侧在库里找不到了"))));
  return card;
}

function other(p, id) { return id === p.left_id ? p.right_id : p.left_id; }

function renderFacts(o) {
  const a = o.access || { calls: 0, labels: [], read_entries: 0 };
  const s = o.summaries || { covered: 0, total: 0 };
  const sync = o.sync.targets.every(t => t.exists && !t.changes) ? "已是最新" : "待写";
  document.getElementById("facts").replaceChildren(
    el("div", { class: "path" }, o.vault),
    el("div", {}, "有效 ", el("b", {}, o.sync.live), " · 共 ", el("b", {}, o.total),
      " 条 · 回写 ", el("b", {}, o.sync.block_chars.toLocaleString()), " 字（" + sync + "）",
      " · 被 AI 读过 ", el("b", {}, a.calls), " 次",
      a.labels.length ? "（" + a.labels.join("、") + "）" : ""),
    s.total && s.covered < s.total
      ? el("div", {}, "一句话概括 " + s.covered + "/" + s.total + " 条，其余的显示原文首行。跑 ",
          el("b", {}, "memoryhub summarize"), " 可补齐。")
      : null);
  document.getElementById("n-todo").textContent = String(state.proposals.length + state.pending.length) || "";
  document.getElementById("n-all").textContent = String(state.entries.length) || "";
}

function renderCats() {
  const host = document.getElementById("cats");
  const show = state.view === "all";
  host.hidden = !show;
  if (!show) { host.replaceChildren(); return; }
  const counts = {};
  for (const e of state.entries) counts[e.category] = (counts[e.category] || 0) + 1;
  const keys = ["", ...Object.keys(CAT).filter(k => counts[k])];
  host.replaceChildren(...keys.map(key =>
    el("button", {
      class: "pill sub", "aria-selected": state.cat === key ? "true" : "false",
      onclick: () => { state.cat = key; renderCats(); renderFeed(); }
    }, key ? CAT[key] : "全部", el("span", { class: "n" }, String(key ? counts[key] : state.entries.length)))));
}

function renderFeed() {
  const host = document.getElementById("feed");
  const cards = [];
  if (state.view === "todo") {
    cards.push(...state.proposals.map(proposalCard));
    cards.push(...state.pending.map(e => entryCard(e, { todo: true })));
    if (!cards.length) {
      host.replaceChildren(el("div", { class: "empty" },
        "没有要处理的东西。",
        el("div", {}, "新记忆进来后会出现在这里；用 ",
          el("code", {}, "memoryhub scan"), " 或 MCP 的 memory_propose 提交。")));
      return;
    }
  } else {
    const list = state.entries.filter(e => !state.cat || e.category === state.cat);
    if (!list.length) {
      host.replaceChildren(el("div", { class: "empty" }, "这一类还没有记忆。"));
      return;
    }
    cards.push(...list.map(e => entryCard(e)));
  }
  host.replaceChildren(...cards);
}

function render() {
  renderFacts(state.overview);
  renderCats();
  renderFeed();
}

// -------------------------------------------------------------------- actions

async function decide(entry, action, category) {
  try {
    const out = await api("/api/review", { id: entry.id, action, category });
    if (action === "category") {
      state.pending = state.pending.map(e => e.id === entry.id ? out.entry : e);
      state.entries = state.entries.map(e => e.id === entry.id ? out.entry : e);
      toast("已改成「" + CAT[category] + "」");
    } else {
      state.pending = state.pending.filter(e => e.id !== entry.id);
      toast(action === "approve" ? "已留下，从现在起每个 AI 都能读到" : "已丢掉，文件还在 inbox/rejected");
    }
    renderFeed();
    await reload({ keepLists: true });
  } catch (err) {
    toast(err.message, true);
  }
}

async function dismissProposal(p) {
  // Closes the *question*, not a memory. Neither entry changes; the record moves
  // to logs/conflicts/ with verdict "unrelated" so the same two bodies are not
  // asked about again.
  try {
    await api("/api/dismiss", { left: p.left_id, right: p.right_id });
    state.proposals = state.proposals.filter(item => item !== p);
    toast("已关闭这条提案，两条记忆都没动");
    renderFeed();
    await reload({ keepLists: true });
  } catch (err) {
    toast(err.message, true);
  }
}

async function supersede(keepEntry, retireId, proposal) {
  try {
    await api("/api/supersede", {
      old: retireId, new: keepEntry.id, note: "webui:" + (proposal.relation || "")
    });
    toast("已保留这一条，另一条关闭有效期（没有删除）");
    await reload();
  } catch (err) {
    toast(err.message, true);
  }
}

async function reload(opts) {
  const keep = opts && opts.keepLists;
  const [overview, pending, proposals, entries] = await Promise.all([
    api("/api/overview"),
    keep ? Promise.resolve({ entries: state.pending }) : api("/api/pending"),
    api("/api/proposals"),
    api("/api/entries?limit=300")
  ]);
  state.overview = overview;
  state.pending = pending.entries;
  state.proposals = proposals.proposals;
  state.entries = entries.entries;
  render();
  if (overview.unreadable && overview.unreadable.length) {
    toast(overview.unreadable.length + " 个文件读不出来", true);
  }
}

document.getElementById("refresh").addEventListener("click", () => reload().catch(e => toast(e.message, true)));
for (const b of document.querySelectorAll("#pills .pill")) {
  b.addEventListener("click", () => {
    state.view = b.dataset.view;
    for (const other of document.querySelectorAll("#pills .pill")) {
      other.setAttribute("aria-selected", other === b ? "true" : "false");
    }
    renderCats();
    renderFeed();
  });
}

document.addEventListener("keydown", (ev) => {
  if (ev.target.matches("input, select, textarea")) return;
  if (state.view !== "todo") return;
  const todo = [...state.proposals.map(p => null), ...state.pending];
  if (!todo.length) return;
  if (ev.key === "j" || ev.key === "k") {
    state.cursor = Math.max(0, Math.min(todo.length - 1, state.cursor + (ev.key === "j" ? 1 : -1)));
    document.querySelectorAll("#feed .card")[state.cursor]?.scrollIntoView({ block: "center", behavior: "smooth" });
  }
  const cur = todo[state.cursor];
  if (!cur) return;
  if (ev.key === "a" && cur.trust !== "blocked") decide(cur, "approve");
  if (ev.key === "r") decide(cur, "reject");
});

reload().catch(err => {
  toast(err.message, true);
  document.getElementById("feed").append(el("div", { class: "empty" },
    "连不上。如果提示 token 错误，回到终端用最新打印的地址重新打开。"));
});
</script>
</body>
</html>
