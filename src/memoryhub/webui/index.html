<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mh-token" content="__MEMORYHUB_TOKEN__">
<title>MemoryHub</title>
<style>
  :root {
    --bg: #0f1216;
    --panel: #161b22;
    --panel-2: #1c232c;
    --line: #2a323d;
    --fg: #d7dee8;
    --dim: #7d8794;
    --faint: #4d5663;
    --ok: #3fb950;
    --no: #f85149;
    --warn: #d29922;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.55 ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, "Noto Sans Mono CJK SC", monospace;
  }
  a { color: var(--accent); }
  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 12px 20px; border-bottom: 1px solid var(--line); background: #0b0e12;
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 13px; margin: 0; letter-spacing: .18em; font-weight: 600; }
  header .vault { color: var(--faint); font-size: 12px; }
  header .spacer { flex: 1; }
  header button {
    background: transparent; border: 1px solid var(--line); color: var(--dim);
    padding: 4px 10px; border-radius: 4px; cursor: pointer; font: inherit; font-size: 12px;
  }
  header button:hover { color: var(--fg); border-color: var(--faint); }

  main { padding: 18px 20px 60px; max-width: 1080px; margin: 0 auto; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
  .card .n { font-size: 22px; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .card .k { color: var(--dim); font-size: 11px; letter-spacing: .08em; margin-top: 2px; }
  .card .sub { color: var(--faint); font-size: 11px; margin-top: 4px; }
  .card.hot .n { color: var(--warn); }

  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .tabs button {
    background: transparent; border: 0; border-bottom: 2px solid transparent;
    color: var(--dim); padding: 8px 13px; cursor: pointer; font: inherit;
  }
  .tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
  .tabs .count { color: var(--faint); margin-left: 6px; }

  .tip { color: var(--dim); font-size: 12px; margin: 0 0 12px; }
  .empty { color: var(--faint); padding: 28px 4px; }

  .item {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .item.blocked { border-color: #5c3b14; }
  .item .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 11px; color: var(--faint); margin-bottom: 8px; }
  .item .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .item .acts { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .item .acts .id { color: var(--faint); font-size: 11px; margin-left: auto; }

  .badge { border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px; color: var(--dim); }
  .badge.cat { color: var(--fg); border-color: var(--faint); }
  .badge.blocked { color: var(--warn); border-color: #5c3b14; }
  .badge.danger { color: var(--no); border-color: #5c1e1c; }
  .badge.ok { color: var(--ok); border-color: #1f4025; }

  button.act {
    font: inherit; font-size: 12px; padding: 4px 11px; border-radius: 4px; cursor: pointer;
    background: var(--panel-2); color: var(--fg); border: 1px solid var(--line);
  }
  button.act:hover { border-color: var(--faint); }
  button.act:disabled { opacity: .4; cursor: not-allowed; }
  button.act.primary { color: #05130a; background: var(--ok); border-color: var(--ok); }
  button.act.danger { color: var(--no); }
  button.act.danger:hover { border-color: var(--no); }

  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 760px) { .pair { grid-template-columns: 1fr; } }
  .side { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 10px 12px; }
  .side.chosen { border-color: var(--ok); }
  .side .hint { color: var(--faint); font-size: 11px; margin-bottom: 6px; }
  .reason { color: var(--dim); border-left: 2px solid var(--line); padding: 2px 0 2px 10px; margin: 10px 0; font-size: 12px; }
  .warn {
    color: #e3b341; background: #2b2008; border: 1px solid #5c3b14; border-radius: 4px;
    padding: 6px 9px; margin-top: 8px; font-size: 12px;
  }
  .claims { margin: 8px 0 0; padding-left: 18px; color: var(--dim); font-size: 12px; }
  .claims q { color: var(--fg); }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 500; font-size: 11px; letter-spacing: .06em; }
  td.mono { overflow-wrap: anywhere; color: var(--dim); }

  #toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px);
    background: #1f2630; border: 1px solid var(--line); color: var(--fg);
    padding: 8px 14px; border-radius: 5px; opacity: 0; pointer-events: none;
    transition: opacity .18s, transform .18s; max-width: 70vw;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.bad { border-color: #5c1e1c; color: #ffb4ab; }
</style>
</head>
<body>
<header>
  <h1>MEMORYHUB</h1>
  <span class="vault" id="vault"></span>
  <span class="spacer"></span>
  <button id="refresh" title="重新读一遍库">刷新</button>
</header>

<main>
  <section class="cards" id="cards"></section>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="pending" aria-selected="true">待审<span class="count" id="c-pending"></span></button>
    <button role="tab" data-tab="proposals" aria-selected="false">冲突提案<span class="count" id="c-proposals"></span></button>
    <button role="tab" data-tab="sync" aria-selected="false">回写</button>
  </nav>

  <section id="panel-pending">
    <p class="tip">批准 = 从今往后每个接上来的 AI 都能读到。拒绝不会删除文件，只是不再返回。键盘 <kbd>a</kbd> 批准 / <kbd>r</kbd> 拒绝。</p>
    <div id="pending"></div>
  </section>

  <section id="panel-proposals" hidden>
    <p class="tip">模型只出提案。点任意一侧就是「保留它、让另一条关闭有效期」——取代链只有一个写入口，成环会被拒。</p>
    <div id="proposals"></div>
  </section>

  <section id="panel-sync" hidden>
    <p class="tip">写入是命令行动作（<code>memoryhub sync --write</code>）：它会改三个工具启动时读的文件，不放进浏览器按钮里。</p>
    <div id="synctable"></div>
  </section>
</main>

<div id="toast"></div>

<script>
// The token is rendered into the meta tag by the server; the URL parameter is a
// fallback for a page saved before this was added. Never in localStorage --
// sessionStorage dies with the tab, and this page has no business surviving it.
const metaEl = document.querySelector('meta[name="mh-token"]');
const rendered = metaEl ? metaEl.content : "";
let TOKEN = rendered && !rendered.startsWith("__") ? rendered : "";
if (!TOKEN) TOKEN = new URLSearchParams(location.search).get("t") || sessionStorage.getItem("mh-token") || "";
if (TOKEN) sessionStorage.setItem("mh-token", TOKEN);
if (location.search.includes("t=")) history.replaceState(null, "", location.pathname);

const CAT = { profile: "身份", decision: "决定", preference: "偏好", project: "项目", knowledge: "知识" };
let state = { overview: null, pending: [], proposals: [], cursor: 0 };

function el(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return node;
}

async function api(path, body) {
  const opt = { headers: { "X-MemoryHub-Token": TOKEN } };
  if (body) {
    opt.method = "POST";
    opt.headers["Content-Type"] = "application/json";
    opt.body = JSON.stringify(body);
  }
  const res = await fetch(path, opt);
  const data = await res.json().catch(() => ({ ok: false, error: "响应不是 JSON" }));
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

let toastTimer = null;
function toast(msg, bad) {
  const box = document.getElementById("toast");
  box.textContent = msg;
  box.className = "show" + (bad ? " bad" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { box.className = ""; }, bad ? 6000 : 2600);
}

function badge(text, cls) { return el("span", { class: "badge" + (cls ? " " + cls : "") }, text); }

function renderCards(o) {
  const cards = document.getElementById("cards");
  const pending = (o.by_status.pending || 0);
  const blocked = state.pending.filter(e => e.trust === "blocked").length;
  cards.replaceChildren(
    el("div", { class: "card" + (pending ? " hot" : "") },
      el("div", { class: "n" }, pending),
      el("div", { class: "k" }, "待审"),
      el("div", { class: "sub" }, blocked ? blocked + " 条 blocked，不能直接批" : "队列已清空")),
    el("div", { class: "card" + (o.conflicts.open ? " hot" : "") },
      el("div", { class: "n" }, o.conflicts.open),
      el("div", { class: "k" }, "冲突提案"),
      el("div", { class: "sub" }, Object.entries(o.conflicts.by_relation).map(([k, v]) => k + " " + v).join(" / ") || "无")),
    el("div", { class: "card" },
      el("div", { class: "n" }, o.sync.live),
      el("div", { class: "k" }, "有效记忆"),
      el("div", { class: "sub" }, "回写区块 " + o.sync.block_chars.toLocaleString() + " 字")),
    el("div", { class: "card" },
      el("div", { class: "n" }, o.total),
      el("div", { class: "k" }, "库里共"),
      el("div", { class: "sub" }, Object.entries(o.by_status).map(([k, v]) => k + " " + v).join(" / ")))
  );
  document.getElementById("vault").textContent = o.vault;
  document.getElementById("c-pending").textContent = pending ? String(pending) : "";
  document.getElementById("c-proposals").textContent = o.conflicts.open ? String(o.conflicts.open) : "";
}

function renderPending() {
  const host = document.getElementById("pending");
  if (!state.pending.length) {
    host.replaceChildren(el("div", { class: "empty" }, "没有待审条目。"));
    return;
  }
  host.replaceChildren(...state.pending.map((e, i) => {
    const blocked = e.trust === "blocked";
    const hot = i === state.cursor;
    return el("article", { class: "item" + (blocked ? " blocked" : "") },
      el("div", { class: "meta" },
        badge(CAT[e.category] || e.category, "cat"),
        badge(e.source_adapter || "unknown"),
        e.sensitivity !== "normal" ? badge("sensitivity=" + e.sensitivity, "danger") : null,
        blocked ? badge("blocked", "blocked") : null,
        el("span", {}, e.chars + " 字 · " + (e.created_at || "").slice(0, 16).replace("T", " "))),
      el("div", { class: "body" }, e.body),
      el("div", { class: "acts" },
        el("button", {
          class: "act primary", disabled: blocked,
          title: blocked ? "blocked 不能直接批" : "进入检索与回写",
          onclick: () => decide(e, "approve")
        }, "批准"),
        el("button", { class: "act danger", onclick: () => decide(e, "reject") }, "拒绝"),
        el("select", {
          class: "act",
          onchange: (ev) => decide(e, "category", ev.target.value)
        }, el("option", { value: "" }, "改分类…"),
           ...Object.entries(CAT).filter(([k]) => k !== e.category)
             .map(([k, v]) => el("option", { value: k }, v))),
        el("span", { class: "id" }, e.id)));
  }));
}

function renderProposals() {
  const host = document.getElementById("proposals");
  if (!state.proposals.length) {
    host.replaceChildren(el("div", { class: "empty" }, "没有未处理的提案。"));
    return;
  }
  host.replaceChildren(...state.proposals.map((p, i) => {
    const contested = p.relation === "contradicts";
    const side = (entry, label) => {
      if (!entry) return el("div", { class: "side" }, el("div", { class: "hint" }, label), el("div", { class: "empty" }, "这一侧在库里找不到了"));
      const chosen = p.winner && p.winner === entry.id;
      return el("div", { class: "side" + (chosen ? " chosen" : "") },
        el("div", { class: "hint" }, label + " · " + (CAT[entry.category] || entry.category) + (chosen ? " · 模型倾向保留这条" : "")),
        el("div", { class: "body" }, entry.body),
        entry.crowded ? el("div", { class: "warn" },
          "这条装了不止一件事（" + entry.chars + " 字）。保留它没问题；但反过来取代它，会把它一并压住的其它内容一起从检索里藏掉。") : null,
        el("div", { class: "acts" },
          el("button", {
            class: "act primary", disabled: !!p.stale,
            onclick: () => supersede(entry, other(p, entry.id), p),
            title: p.stale || "保留这条，让另一条关闭有效期"
          }, "保留这条"),
          el("span", { class: "id" }, entry.id)));
    };
    return el("article", { class: "item" },
      el("div", { class: "meta" },
        badge(contested ? "矛盾" : "重复", contested ? "danger" : "ok"),
        badge("scope=" + (p.scope || "?")),
        p.verified === false ? badge("证据未核实", "danger") : null,
        p.stale ? badge("不可应用：" + p.stale, "blocked") : null,
        el("span", {}, (p.detected_at || "").slice(0, 16).replace("T", " ") + " · " + (p.model || ""))),
      el("div", { class: "pair" }, side(p.left, "A"), side(p.right, "B")),
      p.reason ? el("div", { class: "reason" }, p.reason) : null,
      (p.claims || []).length ? el("ul", { class: "claims" },
        p.claims.map(c => el("li", {}, (c.relation || "") + "：",
          el("q", {}, c.quote_left || ""), " ↔ ", el("q", {}, c.quote_right || "")))) : null);
  }));
}

function other(p, id) { return id === p.left_id ? p.right_id : p.left_id; }

function renderSync() {
  const o = state.overview;
  if (!o) return;
  const rows = o.sync.targets.map(t => el("tr", {},
    el("td", {}, t.key),
    el("td", {}, t.label),
    el("td", { class: "mono" }, t.path),
    el("td", {}, t.exists ? (t.changes ? "将更新" : "已是最新") : (t.note || "缺失"))));
  document.getElementById("synctable").replaceChildren(
    el("table", {}, el("thead", {}, el("tr", {},
      el("th", {}, "目标"), el("th", {}, "工具"), el("th", {}, "文件"), el("th", {}, "状态"))),
      el("tbody", {}, rows)));
}

async function decide(entry, action, category) {
  try {
    const out = await api("/api/review", { id: entry.id, action, category });
    const word = action === "approve" ? "已批准" : action === "reject" ? "已拒绝" : "分类已改";
    toast(word + " " + entry.id);
    const out2 = out.entry;
    if (out2 && action === "category") {
      state.pending = state.pending.map(e => e.id === entry.id ? out2 : e);
      renderPending();
    } else {
      state.pending = state.pending.filter(e => e.id !== entry.id);
      state.cursor = Math.max(0, Math.min(state.cursor, state.pending.length - 1));
      renderPending();
    }
    await reload({ keepPending: true });
  } catch (err) {
    toast(err.message, true);
  }
}

async function supersede(keepEntry, retireId, proposal) {
  const keepId = keepEntry.id;
  let msg = "保留 " + keepId + "，让 " + retireId + " 关闭有效期？\n\n旧条目不会删除，保留可追溯。";
  if (keepEntry.crowded) {
    msg += "\n\n注意：这条 " + keepEntry.chars + " 字里装了好几件事。它被取代时，这些内容会一起从检索和回写里消失 —— 如果其中只有一句过期，先去命令行把还有效的部分拆成独立记忆。";
  }
  if (!confirm(msg)) return;
  try {
    await api("/api/supersede", { old: retireId, new: keepId, note: "webui:" + (proposal.relation || "") });
    toast("已取代 " + retireId);
    await reload();
  } catch (err) {
    toast(err.message, true);
  }
}

function switchTab(name) {
  for (const b of document.querySelectorAll(".tabs button")) {
    const on = b.dataset.tab === name;
    b.setAttribute("aria-selected", on ? "true" : "false");
    document.getElementById("panel-" + b.dataset.tab).hidden = !on;
  }
}

async function reload(opts) {
  const keepPending = opts && opts.keepPending;
  const [overview, pending, proposals] = await Promise.all([
    api("/api/overview"),
    keepPending ? Promise.resolve({ entries: state.pending }) : api("/api/pending"),
    api("/api/proposals")
  ]);
  state.overview = overview;
  state.pending = pending.entries;
  state.proposals = proposals.proposals;
  renderCards(overview);
  renderPending();
  renderProposals();
  renderSync();
  if (overview.unreadable && overview.unreadable.length) {
    toast(overview.unreadable.length + " 个文件读不出来，它们仍是 pending", true);
  }
}

document.getElementById("refresh").addEventListener("click", () => reload().catch(e => toast(e.message, true)));
for (const b of document.querySelectorAll(".tabs button")) {
  b.addEventListener("click", () => switchTab(b.dataset.tab));
}

document.addEventListener("keydown", (ev) => {
  if (ev.target.matches("input, select, textarea")) return;
  if (!document.getElementById("panel-pending").hidden === false) {
    if (ev.key === "j" || ev.key === "k") {
      state.cursor = Math.max(0, Math.min(state.pending.length - 1, state.cursor + (ev.key === "j" ? 1 : -1)));
      renderPending();
      document.querySelectorAll("#pending .item")[state.cursor]?.scrollIntoView({ block: "center" });
    }
    const cur = state.pending[state.cursor];
    if (!cur) return;
    if (ev.key === "a" && cur.trust !== "blocked") decide(cur, "approve");
    if (ev.key === "r") decide(cur, "reject");
  }
});

reload().catch(err => {
  toast(err.message, true);
  document.querySelector("main").append(el("p", { class: "tip" }, "如果提示 token 错误，回到终端用最新打印的地址重新打开。"));
});
</script>
</body>
</html>
